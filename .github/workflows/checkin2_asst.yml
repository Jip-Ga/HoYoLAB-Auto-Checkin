name: HoYoLab 자동 출석 (9시,11시,12시,13시,18시,22시,23시,0시)_백업

on:
  schedule:
    - cron: "8 0 * * *"   # 한국시간 09:08
    - cron: "10 2 * * *"   # 한국시간 11:10
    - cron: "11 3 * * *"   # 한국시간 12:11
    - cron: "12 4 * * *"   # 한국시간 13:12
    - cron: "17 9 * * *"   # 한국시간 18:17
    - cron: "21 13 * * *"   # 한국시간 22:21
    - cron: "22 14 * * *"   # 한국시간 23:22
    - cron: "23 15 * * *"   # 한국시간 00:23
  workflow_dispatch: {}

jobs:
  checkin:
    runs-on: ubuntu-latest
    steps:
      - name: 레포 체크아웃
        uses: actions/checkout@v4

      - name: 오늘 날짜(한국시간) 구하기
        id: date
        run: echo "today=$(TZ='Asia/Seoul' date +'%Y-%m-%d')" >> "$GITHUB_OUTPUT"

      - name: 오늘 성공 기록 확인
        id: cache-check
        uses: actions/cache@v4
        with:
          path: .checkin-done
          key: checkin-success-${{ steps.date.outputs.today }}

      - name: Node.js 설치
        if: steps.cache-check.outputs.cache-hit != 'true' || github.event_name == 'workflow_dispatch'
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 의존성 설치
        if: steps.cache-check.outputs.cache-hit != 'true' || github.event_name == 'workflow_dispatch'
        run: npm install

      - name: 출석 체크 실행
        if: steps.cache-check.outputs.cache-hit != 'true' || github.event_name == 'workflow_dispatch'
        env:
          ACCOUNTS_JSON: ${{ secrets.ACCOUNTS_JSON }}
          USE_LAST_AVATAR_WEBHOOK: "o"
        run: node index.js

      - name: 오늘 성공 기록 저장
        if: steps.cache-check.outputs.cache-hit != 'true' || github.event_name == 'workflow_dispatch'
        run: echo "${{ steps.date.outputs.today }}" > .checkin-done
