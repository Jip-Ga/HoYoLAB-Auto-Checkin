name: HoYoLab 자동 출석 (오전 1시~5시)

on:
  schedule:
    - cron: "16 16 * * *"   # 한국시간 01:16
    - cron: "16 17 * * *"   # 한국시간 02:16
    - cron: "56 19 * * *"   # 한국시간 04:56
    - cron: "46 20 * * *"   # 한국시간 05:46
  workflow_dispatch: {}

permissions:
  contents: write  # 오늘 성공 기록 캐시 삭제 + UID 캐시 파일 커밋에 필요한 권한
  actions: write   # 오래된 캐시를 삭제하려면 필요한 권한

jobs:
  checkin:
    runs-on: ubuntu-latest
    timeout-minutes: 10   # 10분 넘게 실행되면 자동 취소
    steps:
      - name: 레포 체크아웃
        uses: actions/checkout@v4

      - name: 오늘 날짜(한국시간) 구하기
        id: date
        run: echo "today=$(TZ='Asia/Seoul' date +'%Y-%m-%d')" >> "$GITHUB_OUTPUT"

      - name: 오늘 성공 기록 확인 (실패해도 무시하고 계속 진행)
        id: cache-check
        continue-on-error: true
        uses: actions/cache@v4
        with:
          path: .checkin-done
          key: checkin-success-${{ steps.date.outputs.today }}

      - name: Node.js 설치
        if: steps.cache-check.outputs.cache-hit != 'true' || github.event_name == 'workflow_dispatch'
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 의존성 설치
        if: steps.cache-check.outputs.cache-hit != 'true' || github.event_name == 'workflow_dispatch'
        run: npm install

      - name: 출석 체크 실행
        id: run-checkin
        if: steps.cache-check.outputs.cache-hit != 'true' || github.event_name == 'workflow_dispatch'
        env:
          ACCOUNTS_JSON: ${{ secrets.ACCOUNTS_JSON }}
          USE_LAST_AVATAR_WEBHOOK: "o"
        run: node index.js

      - name: 오늘 성공 기록 저장 (진짜 새로 출석 성공했을 때만)
        if: steps.run-checkin.outputs.had_new_success == 'true'
        run: echo "${{ steps.date.outputs.today }}" > .checkin-done

      - name: 이전 날짜 캐시 정리 (오늘 새로 출석 성공했을 때만)
        if: steps.run-checkin.outputs.had_new_success == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TODAY_KEY="checkin-success-${{ steps.date.outputs.today }}"
          echo "오늘 캐시 키: $TODAY_KEY (이건 남기고, 나머지 날짜는 삭제합니다)"
          gh cache list --key checkin-success- --json id,key --limit 100 \
            --jq ".[] | select(.key != \"$TODAY_KEY\") | .id" | while read -r id; do
              echo "🗑 오래된 캐시 삭제: $id"
              gh cache delete "$id" || true
            done

      - name: UID 캐시 파일 저장 (커밋 기록 안 쌓이게 마지막 커밋에 덮어씀)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if [ ! -d .date ]; then
            echo "저장할 파일이 없어 건너뜁니다."
            exit 0
          fi

          git add .date

          if git diff --cached --quiet; then
            echo "변경 사항 없음, 커밋 생략"
            exit 0
          fi

          COMMIT_MARKER="chore(auto): update uid cache [skip ci]"
          LAST_MSG="$(git log -1 --pretty=%B 2>/dev/null || echo '')"

          if [ "$LAST_MSG" = "$COMMIT_MARKER" ]; then
            echo "이전 자동 커밋을 덮어씁니다 (amend)"
            git commit --amend --no-edit
          else
            echo "새 자동 커밋을 만듭니다 (다음부터는 계속 덮어씀)"
            git commit -m "$COMMIT_MARKER"
          fi

          git push origin HEAD:${{ github.ref_name }} --force-with-lease
