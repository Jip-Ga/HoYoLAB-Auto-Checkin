name: HoYoLab 자동 출석 (2차 백업)

on:
  schedule:
    - cron: "1 17 * * *"   # 한국시간 오전 2시 1분
  workflow_dispatch: {}

jobs:
  checkin:
    runs-on: ubuntu-latest
    steps:
      - name: 레포 체크아웃
        uses: actions/checkout@v4

      - name: 오늘 날짜(한국시간) 구하기
        id: date
        run: echo "today=$(TZ='Asia/Seoul' date +'%Y-%m-%d')" >> "$GITHUB_OUTPUT"

      - name: 오늘 성공 기록 확인
        id: cache-check
        uses: actions/cache@v4
        with:
          path: .checkin-done
          key: checkin-success-${{ steps.date.outputs.today }}

      - name: Node.js 설치
        if: steps.cache-check.outputs.cache-hit != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 의존성 설치
        if: steps.cache-check.outputs.cache-hit != 'true'
        run: npm install

      - name: 출석 체크 실행
        if: steps.cache-check.outputs.cache-hit != 'true'
        env:
          ACCOUNTS_JSON: ${{ secrets.ACCOUNTS_JSON }}
          USE_LAST_AVATAR_WEBHOOK: "o"
        run: node index.js

      - name: 오늘 성공 기록 저장
        if: steps.cache-check.outputs.cache-hit != 'true'
        run: echo "${{ steps.date.outputs.today }}" > .checkin-done