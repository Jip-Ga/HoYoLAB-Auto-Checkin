name: HoYoLab 자동 출석 (오후 8시~11시)

on:
  schedule:
    - cron: "0 11 * * *"   # 한국시간 20:00
    - cron: "0 12 * * *"   # 한국시간 21:00
    - cron: "0 13 * * *"   # 한국시간 22:00
    - cron: "0 14 * * *"   # 한국시간 23:00
  workflow_dispatch: {}

jobs:
  checkin:
    runs-on: ubuntu-latest
    steps:
      - name: 레포 체크아웃
        uses: actions/checkout@v4

      - name: Node.js 설치
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 의존성 설치
        run: npm install

      - name: 출석 체크 실행
        env:
          ACCOUNTS_JSON: ${{ secrets.ACCOUNTS_JSON }}
          USE_LAST_AVATAR_WEBHOOK: "o"
        run: node index.js
