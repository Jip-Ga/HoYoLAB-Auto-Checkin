name: HoYoLab 자동 출석 (정각)

on:
  schedule:
    - cron: "0 15 * * *"   # 한국시간 00:00
    - cron: "0 16 * * *"   # 한국시간 01:00
    - cron: "0 17 * * *"   # 한국시간 02:00
    - cron: "0 18 * * *"   # 한국시간 03:00
    - cron: "0 19 * * *"   # 한국시간 04:00
    - cron: "0 20 * * *"   # 한국시간 05:00
    - cron: "0 21 * * *"   # 한국시간 06:00
    - cron: "0 22 * * *"   # 한국시간 07:00
    - cron: "0 23 * * *"   # 한국시간 08:00
    - cron: "0 0 * * *"   # 한국시간 09:00
    - cron: "0 1 * * *"   # 한국시간 10:00
    - cron: "0 2 * * *"   # 한국시간 11:00
    - cron: "0 3 * * *"   # 한국시간 12:00
    - cron: "0 4 * * *"   # 한국시간 13:00
    - cron: "0 5 * * *"   # 한국시간 14:00
    - cron: "0 6 * * *"   # 한국시간 15:00
    - cron: "0 7 * * *"   # 한국시간 16:00
    - cron: "0 8 * * *"   # 한국시간 17:00
    - cron: "0 9 * * *"   # 한국시간 18:00
    - cron: "0 10 * * *"   # 한국시간 19:00
    - cron: "0 11 * * *"   # 한국시간 20:00
    - cron: "0 12 * * *"   # 한국시간 21:00
    - cron: "0 13 * * *"   # 한국시간 22:00
    - cron: "0 14 * * *"   # 한국시간 23:00
  workflow_dispatch: {}

jobs:
  checkin:
    runs-on: ubuntu-latest
    steps:
      - name: 레포 체크아웃
        uses: actions/checkout@v4

      - name: Node.js 설치
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 의존성 설치
        run: npm install

      - name: 출석 체크 실행
        env:
          ACCOUNTS_JSON: ${{ secrets.ACCOUNTS_JSON }}
          USE_LAST_AVATAR_WEBHOOK: "o"
        run: node index.js
